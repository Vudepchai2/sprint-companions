[project]
name = "companions"
version = "0.1.0"
description = "Local engine for sprint companions: per-person memory and quiet notes."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.scripts]
companions = "companions.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
